services:
  # Główna aplikacja Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myrec-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
    volumes:
      # Persist database
      - prisma-data:/app/prisma
      # Persist uploaded files
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Cron job dla przypomnień
  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: myrec-cron
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
    volumes:
      - prisma-data:/app/prisma
    depends_on:
      app:
        condition: service_healthy

volumes:
  prisma-data:
  uploads-data:
